known_gaps: |-
  - Honolulu's CivCheck contract value was not found in public sources this
    cycle; the HNL Build figures above cover the Clariti/Speridian system,
    not CivCheck.
  - The CivCheck-Clariti relationship ("now part of Clariti Software") is
    reported by Stateline/Route Fifty (Aug 2026); deal terms and current
    corporate status were not independently confirmed.
  - Deckard Technologies' and Granicus Host Compliance's jurisdiction counts
    are vendor-reported; we could not verify a specific named controversy or
    a specific named deployment for Deckard in independent sources this
    cycle, so it appears only in landscape prose.
  - GreenLite (AI-assisted private plan review) shows significant venture
    funding but no independently verifiable government deployment in public
    sources; it is excluded from established_vendors.
  - Vancouver's Archistar pilot metrics are vendor-published only; no
    independent evaluation was found.
  - Kelowna's assistant was verified from 2023 coverage; current status was
    not re-verified. The $350,000 grant figure is reported by Business in
    Vancouver and Western Investor; those pages block automated fetchers,
    so it was confirmed from search metadata across both outlets.
  - San Jose's removal of encampment and graffiti detection is documented
    in a city council memo (sanjoseca.gov document 119937) that blocks
    automated fetchers; the removal language was confirmed from the memo
    snippet and matching coverage.
  - Honolulu commercial permit wait trend figures were removed in
    verification; the cited Civil Beat launch story does not carry them.
  - Colorado SB 26-189's reenacted requirements were not reviewed in full;
    the legal_context note is a pointer, not a summary.
  - Accela, OpenGov, and CentralSquare AI product claims were not
    individually verified this cycle; their entries are market-map only.
  - No US court ruling on AI-assisted permit or license adjudication was
    located; the due process items are the pre-AI baseline, applied by
    analogy.
