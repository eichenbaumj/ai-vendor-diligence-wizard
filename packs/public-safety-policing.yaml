registries_to_check:
  - name: NIST Face Recognition Technology Evaluation (FRTE)
    url: https://pages.nist.gov/frvt/html/frvt11.html
    what_it_proves: >-
      Whether a face recognition vendor submits its algorithms for public
      federal testing, under its own name, and how accuracy and demographic
      differentials compare across vendors. Absence from FRTE is a fair
      question to ask about.
  - name: FBI CJIS Security Policy Resource Center
    url: https://le.fbi.gov/cjis-division/cjis-security-policy-resource-center
    what_it_proves: >-
      The actual policy text vendors must align with. Note what it does not
      prove: the FBI does not certify vendors, so "CJIS certified" is
      marketing vocabulary.
  - name: FedRAMP Marketplace
    url: https://marketplace.fedramp.gov/
    what_it_proves: >-
      Whether a specific product holds a federal cloud authorization, and at
      what level. "In process" is different from "authorized."
  - name: GovRAMP Authorized Product List
    url: https://govramp.org/
    what_it_proves: >-
      State-oriented cloud security verification. Formerly StateRAMP; the
      name changed in February 2025.
  - name: Atlas of Surveillance (EFF)
    url: https://atlasofsurveillance.org/
    what_it_proves: >-
      Which agencies already use which surveillance technologies, by vendor
      and type. Useful for finding real reference agencies to call,
      including ones the vendor did not offer.
  - name: AI Incident Database
    url: https://incidentdatabase.ai/
    what_it_proves: >-
      A public log of AI system failures. Search the vendor and product
      name before any demo.

legal_context: |-
  ## Why this category is different

  Outputs in this category feed decisions about stops, arrests, charges,
  bail, sentencing, and custody. When they are wrong, the documented results
  include wrongful arrests (Detroit; $300,000 settlement, June 2024),
  nearly a year in jail on a case prosecutors later dismissed (Chicago;
  $500,000 settlement, March 2026), and targeting programs a sheriff agreed to end
  under court supervision (Pasco County, December 2024). Discovery
  obligations run to the agency and the prosecution, so a vendor's
  trade-secret posture becomes the agency's courtroom problem. This pack
  therefore floors its output at enhanced review, and treats any claim that
  an output alone can justify enforcement action as the strongest caution
  band.

  ## Controlling law and policy

  - Brady v. Maryland, 373 U.S. 83 (1963): the prosecution's disclosure
    obligations reach material evidence, which is why question q03 asks for
    written discovery commitments up front.
  - State v. Loomis, 2016 WI 68 (Wis., July 13, 2016): risk scores may be
    used at sentencing only with written cautions, and may never be the
    determinative factor
    (https://www.wicourts.gov/sc/opinion/DisplayDocument.pdf?content=pdf&seqNo=171690).
  - Illinois Biometric Information Privacy Act (740 ILCS 14, enacted 2008):
    written consent before collecting biometric identifiers; basis of the
    May 2022 Clearview AI settlement
    (https://www.aclu-il.org/cases/aclu-v-clearview-ai/).
  - Washington SB 6280 (signed Mar 31, 2020 with partial veto; effective
    Jul 1, 2021): regulates state and local government use of facial
    recognition services
    (https://app.leg.wa.gov/billsummary?BillNumber=6280&Year=2019).
  - Utah SB 180 (signed Mar 25, 2025; effective May 7, 2025): law
    enforcement agencies must adopt generative-AI policies; AI-assisted
    reports must carry a disclaimer and an author accuracy certification
    (https://le.utah.gov/~2025/bills/static/SB0180.html).
  - California SB 524 (signed Oct 10, 2025; effective Jan 1, 2026):
    AI-assisted police reports must carry disclosures; agencies must retain
    first drafts and audit trails; vendors are barred from selling or
    sharing the data agencies provide to the AI
    (https://www.eff.org/deeplinks/2025/10/victory-california-requires-transparency-ai-police-reports).
  - FBI CJIS Security Policy: binding on access to CJIS systems through
    signed agreements, addenda, and state audits; there is no federal
    vendor certification
    (https://le.fbi.gov/cjis-division/cjis-security-policy-resource-center).
  - Fourth Amendment litigation over camera networks: Schmidt v. City of
    Norfolk (filed Oct 2024; summary judgment for the city in early 2026;
    appeal filed with the Fourth Circuit). Verify current status before
    citing
    (https://www.courthousenews.com/judge-holds-norfolks-license-plate-reader-use-constitutional/).
  - Williams v. City of Detroit settlement (June 28, 2024): binding
    face recognition limits enforceable for four years; the current
    strictest big-city standard
    (https://www.aclu.org/press-releases/civil-rights-advocates-achieve-the-nations-strongest-police-department-policy-on-facial-recognition-technology).
  - Local surveillance-oversight ordinances: many cities require council
    approval and annual reporting before new surveillance technology is
    acquired. Check your own municipal code before any pilot.

realistic_pricing: |-
  Published anchors exist for the two most commoditized product lines:

  - Gunshot detection: about $65,000 to $90,000 per square mile per year in
    direct cost (Manhattan Institute brief, Robert VerBruggen, October 2025:
    https://media4.manhattan-institute.org/wp-content/uploads/thinking-through-the-shotspotter-debate.pdf).
    Multiply by coverage area before the demo; a mid-size city covering 10
    square miles is agreeing to roughly $650K to $900K per year.
  - License plate readers: Flock publishes no list price and quotes bundled
    subscriptions (https://www.flocksafety.com/pricing). Public city
    contracts commonly land near $3,000 per camera per year plus a one-time
    installation fee (practitioner estimate from published municipal
    contracts; verify against your own quote).
  - Place-based prediction software has sold for as little as $20,500 per
    year (Plainfield, NJ's Geolitica subscription, per The Markup, Oct
    2023), a reminder that a low price does not settle the evidence
    questions.
  - Report-drafting AI: no public list price; it is typically sold inside
    body-camera and digital-evidence bundles. Ask for line-item pricing so
    the AI component can be declined at renewal without losing the rest of
    the bundle.

  Heuristic: per-unit subscription pricing compounds quietly. Ask for the
  five-year total cost of ownership, including installation, network
  charges, and every bundled AI feature, and compare it against the anchors
  above. If a quote is several times these anchors, ask what specifically
  justifies the difference.

