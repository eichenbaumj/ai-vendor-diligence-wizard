# Sector pack: permitting-licensing (v1 draft). STANDARD SCRUTINY.
#
# Scrutiny tier call (researched): standard. Every documented US municipal
# deployment in this category (Austin, Los Angeles, Honolulu, Seattle,
# Louisville, Denver) keeps final permit decisions with named staff, and the
# dominant harms on record are delay, cost overrun, and accuracy gaps rather
# than automated deprivation at scale (Stateline/Route Fifty, Aug 2026).
# The exceptions that DO carry deprivation risk (automated denial, license
# revocation, detection-driven violation notices, occupied-property
# surveillance) are handled by elevated_scrutiny_rules below, which floor
# those pitches at enhanced review and, where outputs could touch a person's
# benefits, trigger the eligibility-case-mgmt overlay.
#
# NOTE for integrators: signal_lexicon and diligence_questions[].select are
# new fields for the classifier-fallback and question-selection work; the
# current strict zod schema in scripts/validate-packs.ts will reject them
# until packs-types.ts adds them. Everything else follows pack-spec.md.
pack_id: permitting-licensing
pack_name: Permitting, Licensing & Code Enforcement AI

definition: >-
  AI sold to building departments, planning and development services, code
  enforcement, and business or professional licensing programs: automated
  plan review and code-compliance pre-checks, permit intake triage and
  completeness screening, permitting and licensing chatbots, inspection
  scheduling and routing, and detection tools that scan imagery or rental
  listings for violations. Not this pack alone: general document extraction
  (see document-processing), constituent chatbots with no permit or license
  function (see public-comms), and any pitch whose outputs could deny,
  reduce, or flag a person's public benefits, which triggers the
  eligibility-case-mgmt overlay.

inclusion_test:
  - >-
    Does the pitch mention plan review, plan check, permit approvals, permit
    intake, or code compliance for a building, planning, or development
    services department?
  - >-
    Does it mention business licensing, professional licensing, or license
    applications and renewals for a city, county, or state board?
  - >-
    Does it mention code enforcement, violation detection, or scanning
    imagery, rental listings, or street video to find unpermitted work,
    short-term rentals, or blight?
  - >-
    Does it mention inspection scheduling, inspection routing, or field
    inspection automation?
  - >-
    Does it offer a chatbot or assistant that answers zoning, building code,
    or licensing questions for applicants?

scrutiny_tier: standard

signal_lexicon:
  - plan review
  - plan check
  - permit intake
  - building permit
  - zoning compliance
  - code enforcement
  - business license
  - professional license
  - inspection scheduling
  - certificate of occupancy
  - completeness check
  - prescreen
  - accessory dwelling unit
  - solar permit
  - shot clock

incumbent_landscape: >-
  Layer one is the permitting and licensing system of record: Accela, Tyler
  Technologies (Enterprise Permitting and Licensing, formerly EnerGov),
  OpenGov, Clariti (Salesforce-based), CentralSquare, and Granicus. Most
  cities buy AI as an add-on to one of these, and the costliest documented
  failures in this market are conventional replacements of these systems,
  before any AI: Portland's ITAP project was halted after years of overruns,
  and Honolulu's 2025 HNL Build launch drew almost universally negative
  staff feedback. Layer two is the AI plan-review and pre-check specialists:
  Archistar (Austin, Los Angeles, Vancouver, Surrey), CivCheck (Honolulu,
  Seattle, Denver; reported by Stateline in August 2026 as now part of
  Clariti), Symbium (statutory instant solar permitting in California under
  SB 379), and Govstream.ai. GreenLite sells AI-assisted private plan
  review, in which third-party reviewers act in place of city review where
  state law allows; we could not verify a named government deployment for it
  in public sources. Layer three is detection-driven enforcement: Deckard
  Technologies (Rentalscape) and Granicus (Host Compliance) monitor
  short-term rental listings, with jurisdiction counts that are
  vendor-reported, and San Jose piloted vehicle-mounted cameras for blight
  detection, then dropped encampment and graffiti detection over privacy
  concerns. Layer four is hyperscalers and free public tools: Microsoft
  behind Kelowna's grant-funded permit assistant, and NREL's free SolarAPP+
  for instant residential solar permits. In every documented deployment,
  final permit decisions stay with staff. A listing here is a market-map
  signal and carries no endorsement.

established_vendors:
  - name: Accela
    tier: platform
    one_liner: >-
      Major permitting and licensing system of record for US state and local
      governments.
    gov_evidence_url: null
  - name: Tyler Technologies
    tier: platform
    one_liner: >-
      Enterprise Permitting and Licensing platform (formerly EnerGov);
      acquired ARInspect, an AI field-inspection product, in October 2023.
    gov_evidence_url: https://www.govtech.com/biz/tylers-new-ai-acquisition-focuses-on-government-field-work
  - name: OpenGov
    tier: platform
    one_liner: Permitting and licensing suite widely sold to US local governments.
    gov_evidence_url: null
  - name: Clariti
    tier: platform
    one_liner: >-
      Salesforce-based permitting and licensing platform (acquired Camino in
      2023); Honolulu's HNL Build runs on it, and the launch record there was
      contested (see failure modes).
    gov_evidence_url: https://www.hawaiipublicradio.org/local-news/2024-03-28/honolulu-permitting-department-entering-digital-age-new-software-suite-clariti
  - name: CentralSquare
    tier: platform
