registries_to_check:
  - name: FedRAMP Marketplace
    url: https://marketplace.fedramp.gov/
    what_it_proves: >-
      Whether this specific product holds a federal cloud authorization, and
      at what level.
  - name: GovRAMP Authorized Product List
    url: https://govramp.org/
    what_it_proves: >-
      State-oriented cloud security verification. Formerly StateRAMP; the name
      changed in February 2025.
  - name: Pavilion Contract Hub
    url: https://www.withpavilion.com/
    what_it_proves: >-
      Existing public contracts you may be able to piggyback on; confirms
      other governments have bought the product.
  - name: SAM.gov
    url: https://sam.gov/
    what_it_proves: The company exists as a registered federal contractor.

legal_context: |-
  - IRS Publication 1075 (federal tax information safeguards) applies when
    processed documents contain FTI. Standing requirement as of Aug 28, 2026.
  - HIPAA applies to health documents; a business associate agreement is
    required.
  - SNAP confidentiality rules (7 CFR 272.1) restrict use and disclosure of
    applicant information.
  - State breach-notification laws apply to processing failures that expose
    PII.
  - Title VI language-access obligations extend to how documents from
    limited-English-proficiency residents are handled.

realistic_pricing: |-
  Plain OCR runs about $1.50 per 1,000 pages at every hyperscaler. Full
  extraction (forms, tables, queries) runs $30–70 per 1,000 pages
  (https://aws.amazon.com/textract/pricing/,
  https://cloud.google.com/document-ai/pricing). Human review adds about $30
  per 1,000 reviewed pages in tooling fees (AWS A2I,
  https://aws.amazon.com/augmented-ai/pricing/) plus the review labor itself.
  A 1-million-page-per-year program at full-feature Textract rates is roughly
  $70K per year in API fees before any integrator markup. Azure list prices
  conflicted across sources this cycle; check the live pricing page rather
  than a quoted number.

