    metric: >-
      Court filings showed one plaintiff's vehicle logged 526 times in
      about four months; the district court granted summary judgment for
      the city in early 2026 and the residents appealed to the Fourth
      Circuit
    metric_source_type: independent-press
    source_url: https://www.courthousenews.com/judge-holds-norfolks-license-plate-reader-use-constitutional/
  - agency: Pasco County, FL Sheriff's Office (cautionary)
    vendor_stack: In-house intelligence-led policing models
    what: >-
      Person-based targeting program ended by a federal settlement
    metric: >-
      $105,000 paid (Dec 2024); the office acknowledged interference with
