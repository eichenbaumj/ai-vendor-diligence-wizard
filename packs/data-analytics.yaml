    this cycle.
  - ID.me's pandemic-era record was excluded as unverified this cycle.
  - OpenGov, Polco, and Zencity deployment metrics are vendor-reported, and
    no independent source URL was captured for them.
  - The Zynda settlement's primary court documents are not directly linked;
    it is cited through the BTAH case library.
