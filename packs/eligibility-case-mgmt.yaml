# Sector pack: eligibility-case-mgmt (v1). ELEVATED SCRUTINY.
# This pack also functions as the overlay applied by other packs'
# elevated_scrutiny_rules. Authoring rules: packs/pack-spec.md.
pack_id: eligibility-case-mgmt
pack_name: Eligibility, Benefits Processing & Case Management

definition: >-
  AI that touches who gets benefits or what happens to their case:
  eligibility screening and determination, renewals, verification, fraud
  detection and identity-proofing, case-management copilots, benefit-notice
  generation, and work-requirement compliance tooling. This is the only pack
  where a software error is, by legal definition, a deprivation of a
  constitutionally protected property interest (Goldberg v. Kelly, 397 U.S.
  254). Not this pack alone: pure document extraction (see
  document-processing, unless the output feeds determinations) and
  applicant-side benefit screeners that only widen access, which sit in a
  different risk class.

inclusion_test:
  - >-
    Does the pitch mention eligibility, determinations, enrollment, renewals
    or recertification, benefits processing, or case management for Medicaid,
    SNAP, TANF, unemployment insurance, child care, or child welfare?
  - >-
    Does it mention fraud detection, program integrity, identity
    verification, or "payment accuracy" for a benefits program?
  - >-
    Does it mention work-requirement or community-engagement verification or
    exemption screening (the 2026 OBBBA build-out wave)?
  - >-
    Does it offer caseworker copilots, case summarization, or benefit-notice
    drafting?
  - >-
    Does any other pack's pitch describe outputs that could deny, reduce,
    terminate, or flag a person's benefits? (This is the overlay trigger.)

scrutiny_tier: elevated

incumbent_landscape: >-
  Integrators and COTS: Deloitte dominates integrated eligibility (25+
  states, $5B+ in contracts, roughly 53 million Medicaid enrollees on its
  systems, per KFF Health News:
  https://kffhealthnews.org/news/article/medicaid-deloitte-run-eligibility-systems-plagued-by-errors/).
  Accenture, Gainwell, Conduent, and Optum populate the Medicaid systems
  ecosystem; Maximus is the dominant eligibility-support BPO now marketing
  AI; Merative Curam (formerly IBM) is the social-program COTS; Salesforce
  and ServiceNow push case-management-on-platform; RedMane, Diona, and
  Northwoods sell human-services-specific tooling. Critical context: the
  incumbents' deterministic systems, before any generative AI, produced wrong
  notices, impossible deadlines, 25,000 erroneous Kentucky terminations, and
  2026 Michigan disability miscoverage
  (https://www.npr.org/2026/07/20/nx-s1-5896359/medicaid-disabled-patients-denied-deloitte-michigan).
  Deloitte's defense ("they're not Deloitte systems") shows accountability
  allocation is contested even among the biggest incumbents, so a listing in
  this pack is emphatically not a safety signal. The legitimate near-term AI
  layer is document and intake automation (Hyperscience in Colorado and
  Missouri; Pennsylvania legibility scanning; New Jersey document validation;
  North Carolina summarization, per Code for America:
  https://codeforamerica.org/explore/government-ai-landscape-assessment/).
  The 2025–26 copilot wave: Nava PBC (the most methodologically transparent,
  with an open-source Caseworker Empowerment Toolkit and published
  guardrails), the Maryland and Anthropic navigation agent, Augintel, and
  frontier-lab GSA OneGov seats putting near-free LLMs inside agencies. AI
  increasingly arrives through staff tooling, not procurement. The
  highest-risk adjacent lane is fraud and identity vendors (SAS and FAST
  Enterprises in the MiDAS era; Pondera, now Thomson Reuters; LexisNexis;
  ID.me). Treat any "AI fraud detection" pitch as an adverse-action system,
  full stop.

