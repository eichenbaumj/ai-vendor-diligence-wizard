legal_context: |-
  - State chatbot-disclosure wave: Utah SB 452 (2025), Maine LD 1727, and
    California SB 243, with 14+ new state chatbot laws in 2026
    (https://fpf.org/blog/understanding-the-new-wave-of-chatbot-legislation-california-sb-243-and-beyond/).
  - Texas TRAIGA (effective Jan 1, 2026). Verify current status before
    citing.
  - Washington State Archives position (Jun 2024): generative-AI prompts and
    outputs can be public records
    (https://www.sos.wa.gov/sites/default/files/2025-02/advice-sheet-are-generative-ai-interactions-public-records-(june-2024).pdf).
  - ADA Title II digital accessibility rule (2024) and WCAG 2.1 AA:
    public-facing digital services must be accessible.
  - Title VI: language-access obligations for limited-English-proficiency
    residents; NCSC recommends mandatory human review for machine
    translation with legal consequences.

realistic_pricing: |-
  The documented contract range runs roughly $5,600 basic to $759K+
  enterprise (CivicIQ 2025 vendor pricing guide,
  https://blogs.civiciq.com/2025/12/02/government-ai-chatbots-311-rfps-vendor-pricing-guide-2025/).
  A corpus-bounded FAQ bot priced above $100K deserves a written itemization
  of what the money buys.

last_updated: "2026-08-28"
refresh_cadence: quarterly

known_gaps: |-
  - Vendor and agency accuracy figures in this category are self-reported
    (Georgia's 97%, Ask MA volumes); no independent audit was found in
    public sources.
  - Citibot's customer claims are unverified; the vendor site blocked
    automated fetch.
  - The underlying technology stack of NYC's MyCity bot was not re-verified
    this cycle, so its deployment row names no vendor.
  - GovAI Coalition Trellis registry and state AI inventory URLs (the
    Connecticut statutory inventory, New York's Section 103-e disclosures)
    were not confirmed this cycle, so they are cited by name only.
