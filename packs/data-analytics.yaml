# Sector pack: data-analytics (v1)
# Standard tier with the lowest overlay threshold of any pack: this
# category's cautionary record is the deepest and most adjudicated in
# government AI. Authoring rules: packs/pack-spec.md.
pack_id: data-analytics
pack_name: Data Analytics & Decision Support

definition: >-
  AI and analytics that inform government decisions: dashboards and BI with
  AI layers, "ask your data" LLM interfaces, predictive analytics, risk
  scoring, fraud and program-integrity analytics, and assessment algorithms.
  The first question in this pack is the fork: decoration or decision? A
  dashboard that describes gets standard scrutiny. A score or flag that can
  trigger action against a person is an adverse-action system and adds the
  eligibility-case-mgmt overlay.

inclusion_test:
  - >-
    Does the pitch offer dashboards, BI, "insights," or an AI layer over
    agency data?
  - >-
    Does it offer predictive analytics, risk scores, prioritization, or
    "program integrity" and fraud analytics?
  - >-
    Does it offer assessment or allocation algorithms (care hours, screening
    scores, caseload prioritization)?
  - Does it offer an LLM "chat with your data" interface?

scrutiny_tier: standard

incumbent_landscape: >-
  For BI and dashboards, Power BI, Tableau, and Esri/ArcGIS are ubiquitous.
  Government-specific players include Tyler Data & Insights (formerly
  Socrata, FedRAMP-listed; NYC, Chicago, San Francisco, Los Angeles, and the
  states of New York, Illinois, and Texas;
  https://www.fedramp.gov/marketplace/products/SOCRATA/), OpenGov (AI
  budgeting and performance features, Mar 2024), Polco "Polly," and Zencity
  360. For fraud and integrity analytics: LexisNexis Risk Solutions
  (unemployment insurance, tax refund investigation), Thomson Reuters
  Pondera (FraudCaster for Medicaid, SNAP, UI, WIC, and TANF; EPIC maintains
  a critical spotlight at https://epic.org/pondera-surveillance/), and SAS
  (state UI work). Assessment algorithms (RUGs, SIS, Optum ARIA) allocate
  care hours and form the sub-category with the worst documented track
  record in government AI. Two standing reference shelves answer "has this
  category hurt people before": the Benefits Tech Advocacy Hub case library
  (https://www.btah.org/case-studies.html) and the AI Incident Database
  (https://incidentdatabase.ai/).

