failure_modes:
  - title: Automated fraud adjudication without human review (Michigan MiDAS)
    description: >-
      Michigan's MiDAS system auto-adjudicated unemployment-insurance fraud
      with no human review. A state audit found its determinations were wrong
      more than 90% of the time. Roughly 40,000 people were accused, with
      wage garnishments and bankruptcies that followed. The state paid a $20
      million settlement, and vendor-liability claims proceeded against SAS
      and FAST Enterprises in Cahoo
      (https://www.btah.org/case-study/michigan-unemployment-insurance-false-fraud-determinations.html).
    named_incident: >-
      Michigan MiDAS false fraud determinations; $20M civil-rights settlement
      (2022)
    source_url: https://www.michigan.gov/ag/news/press-releases/2022/10/20/som-settlement-of-civil-rights-class-action-alleging-false-accusations-of-unemployment-fraud
  - title: Automated debt raising at national scale (Robodebt)
    description: >-
      Australia's Robodebt scheme unlawfully raised A$1.76 billion in debts
      against roughly 433,000 people through automated income averaging. It
      ended in a Royal Commission.
    named_incident: Australia Robodebt Royal Commission (2023)
    source_url: https://clcs.org.au/robodebt-royal-commission-report-unravels-systemic-injustice-and-recommends-urgent-reform/
  - title: An algorithm replacing professional discretion (Arkansas ARChoices)
    description: >-
      Arkansas replaced nurse judgment with an algorithm that cut home-care
      hours and failed to account for cerebral palsy in its logic. A court
      permanently enjoined its use.
    named_incident: >-
      Arkansas ARChoices care-hour algorithm permanently enjoined (2018)
    source_url: https://arktimes.com/news/arkansas-reporter/2018/05/31/archoices-rule-blocked
  - title: Trade-secret formulas struck down (Idaho, K.W. v. Armstrong)
    description: >-
      Idaho's "trade secret" budget formula for disability services was
      struck down as effectively arbitrary, and in 2025 the court found the
      state in contempt over delays. Due process outranks trade secrets.
    named_incident: K.W. v. Armstrong (Idaho); 2025 contempt finding
    source_url: https://www.acluidaho.org/en/cases/kw-v-armstrong
  - title: Modernization that cut children off coverage (Tennessee TEDS)
    description: >-
      Tennessee's Deloitte-built $400 million eligibility system contributed
      to roughly 250,000 children losing coverage. A federal court found
      Medicaid Act, due process, and ADA violations in A.M.C. v. Smith.
    named_incident: A.M.C. v. Smith (Tennessee TEDS), federal court ruling
    source_url: https://healthlaw.org/resource/case-explainer-amc-v-smith/
  - title: Confident hallucination on an official channel (NYC MyCity)
    description: >-
      NYC's MyCity chatbot confidently invented program rules on an official
      government channel, gave contradictory answers to identical questions,
      and stayed running for years afterward.
    named_incident: NYC MyCity chatbot (The Markup, Mar 29, 2024)
    source_url: https://themarkup.org/artificial-intelligence/2024/03/29/nycs-ai-chatbot-tells-businesses-to-break-the-law
  - title: LLM-specific failure patterns in benefits work
    description: >-
      Documented and near-term patterns specific to language models: a
      post-hoc rationalization is not an appeal-safe explanation (a generated
      "reason" cannot honestly populate a 42 CFR 431.210 notice unless the
      decision logic is deterministic and cited); automation bias turns a
      nominal "human in the loop" into rubber-stamping at MiDAS and Robodebt
      scale; extraction errors propagate silently into denials; models can be
      sycophantic toward a caseworker's fraud hypothesis; performance gaps
      hit multilingual users and people with disabilities; and rules-to-code
      translation is promising but error-prone in practice.
    named_incident: >-
      Beeck Center rules-as-code experiments with public-benefits policy
      found translation errors
    source_url: https://digitalgovernmenthub.org/library/ai-powered-rules-as-code-experiments-with-public-benefits-policy/

skepticism_triggers:
  - claim_pattern: >-
      "Fully automated eligibility determination" or "touchless processing"
    threshold: Any such claim applied to adverse actions
    why: >-
      Presumptively disqualifying. This is the MiDAS and Robodebt pattern,
      and it maps to the tool's strongest caution band regardless of vendor
      pedigree.
    source_url: https://www.btah.org/case-study/michigan-unemployment-insurance-false-fraud-determinations.html
  - claim_pattern: '"Reduces fraud by X%"'
    threshold: Any fraud-reduction percentage
    why: >-
      Demand the false-positive rate and what happens to flagged people while
      "under review." MiDAS was wrong more than 90% of the time.
    source_url: https://www.michigan.gov/ag/news/press-releases/2022/10/20/som-settlement-of-civil-rights-class-action-alleging-false-accusations-of-unemployment-fraud
  - claim_pattern: '"99%+ accuracy"'
    threshold: >-
      Any accuracy claim without state-specific evaluation, a denominator,
      and breakouts by field, case type, language, and disability
    why: >-
      Blended accuracy hides exactly the errors that become wrongful denials.
    source_url: null
  - claim_pattern: '"Unbiased AI" or "bias-free AI"'
    threshold: Any such claim
    why: >-
      Unfalsifiable. The honest form is "here is our disparate-performance
      testing and here are the results."
    source_url: null
  - claim_pattern: '"Explainable AI" meaning a chatbot paragraph'
    threshold: An explanation that is not a legally sufficient notice
    why: >-
      A generated paragraph is not a 42 CFR 431.210 notice. Ask to see actual
      notice text.
    source_url: null
  - claim_pattern: '"Proprietary; we cannot share how it works"'
    threshold: Any trade-secret posture over decision logic
    why: >-
      K.W. v. Armstrong establishes that due process outranks trade secrets.
    source_url: https://www.acluidaho.org/en/cases/kw-v-armstrong
  - claim_pattern: '"Deploy in weeks" for anything touching the eligibility system'
    threshold: A deployment promise under 90 days
    why: >-
      It ignores APD and CMS/FNS approval gates (45 CFR 95.611). Kentucky's
      single defect took 10 months and $522K to fix.
    source_url: null
  - claim_pattern: '"Human in the loop" without numbers'
    threshold: No items-per-reviewer-per-day or override-rate data
    why: >-
      Near-zero overrides means the human is a rubber stamp.
    source_url: null
  - claim_pattern: >-
      "FedRAMP compliant" or "StateRAMP compliant"; a SOC 2 Type I passed off
      as Type II
    threshold: The word "compliant" instead of "authorized"
    why: >-
      Verify authorization status on the marketplaces directly. "In process"
      is not "authorized."
    source_url: https://marketplace.fedramp.gov/
  - claim_pattern: '"Trusted by [state]"'
    threshold: >-
      A reference that turns out to be an unpaid pilot or a
      constituent-services chatbot rebranded as eligibility tech
    why: >-
      Call the named agency and ask what is actually in production.
    source_url: null
  - claim_pattern: '"AI will clear your backlog"'
    threshold: >-
      Backlog-clearing claims during unwinding or work-requirement crunches
    why: >-
      Speed pressure on adverse actions is precisely how Tennessee and
      Michigan happened.
    source_url: https://healthlaw.org/resource/case-explainer-amc-v-smith/
  - claim_pattern: '"We handle appeals too"'
    threshold: The vendor adjudicating appeals of its own system's decisions
    why: A due-process conflict of interest.
    source_url: null
  - claim_pattern: Free pilots contingent on broad data access
    threshold: Any free pilot conditioned on access to applicant data
    why: >-
      A data-acquisition play. OMB M-25-21 tells federal agencies to bar
      vendor training on government data.
    source_url: https://www.whitehouse.gov/wp-content/uploads/2025/02/M-25-21-Accelerating-Federal-Use-of-AI-through-Innovation-Governance-and-Public-Trust.pdf

diligence_questions:
  - id: eligibility-case-mgmt-q01
    question: >-
      Does your system ever deny, reduce, terminate, or flag-for-fraud on its
      own, or does a named human make every adverse decision?
    good_answer: >-
      An unambiguous "a named human makes every adverse decision," with UI
      evidence showing how.
    red_flag: >-
      "Configurable," "auto-adjudication," or any hedging. This question has
      no acceptable middle answer.
    source_url: null
  - id: eligibility-case-mgmt-q02
    question: >-
      Show the exact notice a person receives after an AI-influenced denial.
      Does it state the specific factual reasons and the regulation relied
      on?
    good_answer: >-
      Actual notice text that satisfies 42 CFR 431.210 (Medicaid) or 7 CFR
      273.13 (SNAP): specific reasons, specific regulation.
    red_flag: >-
      A generic template, or a generated paragraph offered as the
      "explanation."
    source_url: null
  - id: eligibility-case-mgmt-q03
    question: >-
      On appeal, can you produce the complete record (inputs, extractions,
      model version, what the human saw and did), and will you commit in
      contract that nothing is withheld as a trade secret?
    good_answer: >-
      Yes to both, in writing. Idaho's K.W. v. Armstrong establishes that due
      process outranks trade secrets.
    red_flag: Any trade-secret carve-out over decision logic.
    source_url: https://www.acluidaho.org/en/cases/kw-v-armstrong
  - id: eligibility-case-mgmt-q04
    question: >-
      What is your measured accuracy on OUR state's rules, evaluated against
      our policy manual and historically adjudicated cases, and what is the
      denominator?
    good_answer: >-
      State-specific evaluation results with a defined denominator, or an
      honest "we have not measured that yet."
    red_flag: >-
      A generic accuracy number from another state or from a demo corpus.
    source_url: null
  - id: eligibility-case-mgmt-q05
    question: >-
      Break error rates out by language, disability status, age, and, where
      lawful, race and ethnicity. What disparate-performance testing exists,
      and will you support our own pre-deployment and annual testing?
    good_answer: >-
      Published or shareable breakouts, plus support for independent testing.
    red_flag: '"Our AI is unbiased" with no data behind it.'
    source_url: null
  - id: eligibility-case-mgmt-q06
    question: What happens when the model is wrong but confident?
    good_answer: >-
      A confidence-threshold design, the share of items routed to humans, and
      sampling audits of high-confidence outputs.
    red_flag: >-
      No sampling of high-confidence outputs; those are exactly the errors
      that reach residents.
    source_url: null
  - id: eligibility-case-mgmt-q07
    question: >-
      Who updates the system when our state plan, waivers, or verification
      rules change, how fast, and how is the change tested?
    good_answer: >-
      A named process with a turnaround commitment and regression testing.
    red_flag: >-
      No update pipeline. NYC's chatbot stayed wrong for roughly two years.
    source_url: https://themarkup.org/artificial-intelligence/2024/03/29/nycs-ai-chatbot-tells-businesses-to-break-the-law
  - id: eligibility-case-mgmt-q08
    question: >-
      Where does our data go? Is applicant data used to train models or
      shared with third parties? Which of these do you hold: GovRAMP or
      FedRAMP authorization, SOC 2 Type II, IRS Pub 1075 and HIPAA
      compliance?
    good_answer: >-
      Written no-training terms and authorizations you can verify at
      https://marketplace.fedramp.gov/ and https://govramp.org/. "In process"
      is not "authorized."
    red_flag: Verbal assurances, or "compliant" phrasing.
    source_url: https://marketplace.fedramp.gov/
  - id: eligibility-case-mgmt-q09
    question: >-
      Does this require an APD amendment or CMS/FNS sign-off, and have you
      been through that process in other states?
    good_answer: >-
      A knowledgeable answer about 45 CFR 95.611 and named states where the
      vendor navigated it.
    red_flag: >-
      A vendor who has never heard of an APD has never really deployed in
      this space.
    source_url: null
  - id: eligibility-case-mgmt-q10
    question: >-
      Name three comparable agencies in production, not pilots, that we can
      call. What independent evaluations of your product exist?
    good_answer: >-
      Named production references plus any independent evaluation.
      Cross-check the CCF AI Knowledge Hub and Code for America's landscape
      assessment.
    red_flag: >-
      Pilots presented as production, or logos with no callable contact.
    source_url: https://codeforamerica.org/explore/government-ai-landscape-assessment/
  - id: eligibility-case-mgmt-q11
    question: >-
      What is the caseworker's realistic review burden: items per worker per
      day, and your own override-rate data?
    good_answer: >-
      Real numbers: a plausible per-item review time and a nonzero override
      rate.
    red_flag: >-
      No override data, or volumes that make real review impossible.
      Near-zero overrides means rubber-stamping.
    source_url: null
  - id: eligibility-case-mgmt-q12
    question: >-
      What is your rollback plan? If we find a systematic error, how fast can
      we identify every affected case, notify people, and reinstate
      benefits?
    good_answer: >-
      A concrete plan: affected-case query capability, notification
      templates, a reinstatement workflow, and timelines.
    red_flag: No answer here means no deployment.
    source_url: null
  - id: eligibility-case-mgmt-q13
    question: >-
      Who bears liability for wrongful denials caused by system error, and
      will you accept indemnification and audit-rights clauses?
    good_answer: >-
      Contractual acceptance of indemnification and audit rights.
    red_flag: >-
      Liability pushed entirely onto the agency. Deloitte's "not our systems"
      posture shows why this must be contractual.
    source_url: https://kffhealthnews.org/news/article/medicaid-deloitte-run-eligibility-systems-plagued-by-errors/

elevated_scrutiny_rules:
  - condition: Any match on this pack
    action: >-
      The output floor is the "enhanced review" band. The "established
      vendor, proceed to demo" band is unavailable until the
      human-decides-adverse-actions question (q01) is answered.
  - condition: A claim of automated adverse action
    action: Strongest caution band, always.
  - condition: A fraud-detection or identity-verification pitch
    action: >-
      Classify as an adverse-action system regardless of framing.
  - condition: >-
      A work-requirement or exemption-screening pitch (the 2026 build-out
      wave)
    action: >-
      Highest caution band, plus OBBBA implementation-overload context
      (https://www.tpr.org/news/2026-07-21/deloitte-run-systems-denied-medicaid-to-disabled-people-new-laws-could-make-it-worse).
  - condition: >-
      A copilot or summarization-only pitch with named-human decision-making
    action: >-
      May be evaluated on standard merits, with this pack's questions q01,
      q02, q03, and q11 still included.
  - condition: This pack is triggered as an overlay from another pack
    action: >-
      Prepend the "Why this category is different" block (the top of this
      pack's legal_context) and add questions q01, q02, q03, and q12 to that
      pack's question list.

