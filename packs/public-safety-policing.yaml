known_gaps: |-
  - The lint's banned list includes the first word of the CJIS acronym's
    expansion, so this pack refers to the FBI policy only as the CJIS
    Security Policy and rewrites around that word family throughout. A
    carve-out similar to the existing bare-noun program-integrity rule may
    be needed for this sector's ordinary vocabulary.
  - SoundThinking's agency count (about 250) is vendor-reported and was not
    independently verified this cycle.
  - The AP's August 2021 investigation of ShotSpotter evidence in courts
    could not be fetched directly (host blocks retrieval); the Michael
    Williams facts are sourced through the MacArthur Justice Center case
    page and WTTW instead.
  - State facial recognition statutes beyond Illinois and Washington
    (Maine's 2021 law, Massachusetts, Virginia, Montana, Vermont) were not
    re-verified this cycle and are omitted from legal_context.
  - Clearview AI's later enforcement history (the 2025 class-action
    settlement structure, UK ICO litigation) was not verified this cycle
    and is omitted.
  - Schmidt v. City of Norfolk is fast-moving: the district court ruled for
    the city in 2026 and an appeal was announced. Verify before citing.
  - LAPD Operation LASER, the NYPD gang database, and other person-based
    program retirements are omitted pending URL capture.
  - Axon Draft One has no public list price; no pricing anchor exists for
    report-drafting AI.
  - Emergency-management and 911-triage AI (Carbyne, Prepared, RapidSOS)
    is in scope by definition but has no named incident in this draft;
    candidates should be researched next cycle.
