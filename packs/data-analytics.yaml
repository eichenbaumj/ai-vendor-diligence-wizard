failure_modes:
  - title: Black-box scores driving consequential decisions
    description: >-
      Idaho's "trade secret" budget formula collapsed in court (with a 2025
      contempt finding), Arkansas's RUGs-based algorithm was invalidated,
      and State v. Loomis cautions on trade-secret scores in consequential
      decisions (https://harvardlawreview.org/print/vol-130/state-v-loomis/).
      Ask on day one: what will the adverse-action notice say?
    named_incident: >-
      K.W. v. Armstrong (Idaho) and the Arkansas ARChoices injunction
    source_url: https://www.acluidaho.org/en/cases/kw-v-armstrong
  - title: Base rates make "accurate" models mostly wrong about people
    description: >-
      Fraud is rare, so even a statistically strong model mostly flags
      innocent people. The IRS's non-identity-theft fraud filters ran an 81%
      false-positive rate and delayed about $20 billion in legitimate
      refunds while protecting $7.6 billion (oversight finding). Michigan's
      MiDAS was 93% wrong per the state Auditor General. Florida's FIRRE
      flagged trivial discrepancies, produced a 600%+ flag surge, and ended
      in a $92.4M rebuild (https://www.btah.org/case-studies.html).
    named_incident: >-
      IRS fraud filters at an 81% false-positive rate (Taxpayer Advocate,
      oversight)
    source_url: https://www.taxpayeradvocate.irs.gov/wp-content/uploads/2020/07/ARC18_Volume1_MSP_05_FalsePositiveRates.pdf
  - title: Decision support quietly becoming the decision-maker
    description: >-
      A heat map or a score becomes the de facto decision with no appeal
      path. Michigan's Zynda settlement now requires human review of
      automated determinations.
    named_incident: >-
      Michigan Zynda settlement requiring human review of automated
      determinations
    source_url: https://www.btah.org/case-studies.html
  - title: Garbage in, scored anyway
    description: >-
      Idaho ran its formula on unreliable historical data; Missouri's
      algorithm shipped with literal syntax errors; Michigan's SNAP felony
      match auto-terminated roughly 19,000 people before being struck down
      in 2015. An LLM layer adds a hallucination surface on top of every
      data defect.
    named_incident: >-
      Michigan SNAP felony-match auto-terminations, struck down in 2015
    source_url: https://www.btah.org/case-studies.html
  - title: Bias under federal scrutiny
    description: >-
      The Allegheny Family Screening Tool drew DOJ civil-rights attention
      over disability discrimination, and Oregon dropped its analogous
      tool.
    named_incident: >-
      DOJ examination of the Allegheny Family Screening Tool
    source_url: https://www.pbs.org/newshour/nation/ap-report-doj-examining-ai-screening-tool-used-by-pa-child-welfare-agency
  - title: Savings claims that hide the harm side of the ledger
    description: >-
      "Identifies savings of $X" framing counts what was blocked, not what
      was delayed or wrongly denied. The IRS "protected $7.6B" while
      delaying about $20B in legitimate refunds. Demand both sides of the
      ledger before accepting a savings number.
    named_incident: >-
      IRS refund-fraud filters: $7.6B protected versus about $20B in
      legitimate refunds delayed (oversight)
    source_url: https://www.taxpayeradvocate.irs.gov/wp-content/uploads/2020/07/ARC18_Volume1_MSP_05_FalsePositiveRates.pdf

skepticism_triggers:
  - claim_pattern: >-
      "Accuracy" quoted without precision and recall at the operating
      threshold and your base rate
    threshold: Any bare accuracy number
    why: >-
      At fraud-level base rates, high "accuracy" coexists with false-positive
      rates of 80–90%+ among flags. The IRS 81% figure is the benchmark.
    source_url: https://www.taxpayeradvocate.irs.gov/wp-content/uploads/2020/07/ARC18_Volume1_MSP_05_FalsePositiveRates.pdf
  - claim_pattern: A proprietary score with a trade-secret disclosure posture
    threshold: Any refusal to disclose model logic
    why: >-
      The Idaho precedent makes this constitutional exposure, not a
      licensing preference.
    source_url: https://www.acluidaho.org/en/cases/kw-v-armstrong
  - claim_pattern: >-
      "Predicts fraud" or "predicts risk" with no false-positive rate,
      review-queue staffing model, or affected-person notice
    threshold: Absence of all three
    why: The MiDAS and FIRRE pattern.
    source_url: https://www.btah.org/case-studies.html
  - claim_pattern: '"Identifies savings of $X"'
    threshold: Any savings figure without the delayed-or-denied side
    why: >-
      Protected-versus-delayed framing matters: the IRS "protected $7.6B"
      while delaying about $20B in legitimate refunds.
    source_url: https://www.taxpayeradvocate.irs.gov/wp-content/uploads/2020/07/ARC18_Volume1_MSP_05_FalsePositiveRates.pdf
  - claim_pattern: >-
      An LLM "ask your data" interface with no query or row provenance
    threshold: >-
      Generated numbers that do not link to the underlying query and rows
    why: >-
      Hallucinated numbers end up in official decisions. Demand that every
      generated claim link to the query and rows behind it.
    source_url: null
  - claim_pattern: '"Bias-free"'
    threshold: Any such claim
    why: >-
      Unfalsifiable. Demand the disparate-impact testing methodology and the
      results.
    source_url: null
  - claim_pattern: Scores executed without mandatory human sign-off
    threshold: Any auto-executed adverse action
    why: >-
      Maps to the strongest caution band through the eligibility-case-mgmt
      overlay.
    source_url: https://www.btah.org/case-studies.html

diligence_questions:
  - id: data-analytics-q01
    question: >-
      What decisions will these outputs feed, and can a score or flag by
      itself trigger an adverse action against a person (a benefit cut, a
      fraud hold, an investigation)? If yes, we will treat this as a
      high-impact system that needs a different review track.
    good_answer: >-
      A clear scope statement. If adverse actions are possible, the vendor
      accepts the high-impact review track without argument.
    red_flag: >-
      "That depends on how you configure it," without engaging the
      consequences.
    source_url: null
  - id: data-analytics-q02
    question: >-
      Show the exact notice text an affected resident would receive. Can a
      caseworker explain in plain language why this specific person was
      flagged?
    good_answer: >-
      Real notice text with specific reasons a caseworker can explain.
    red_flag: No notice exists because "the score is advisory."
    source_url: null
  - id: data-analytics-q03
    question: >-
      Will you contractually commit to disclosing model logic, features, and
      weights to us, our auditors, and a court if litigated?
    good_answer: >-
      Yes, in contract. Idaho's K.W. v. Armstrong shows trade-secret
      postures fail in court.
    red_flag: Trade-secret carve-outs over decision logic.
    source_url: https://www.acluidaho.org/en/cases/kw-v-armstrong
  - id: data-analytics-q04
    question: >-
      Not "accuracy": what are precision and recall at your recommended
      threshold, validated on data like ours? At our prevalence, how many
      flags per 100 are false positives, and what staffing does the review
      queue require?
    good_answer: >-
      Threshold-level precision and recall plus a staffing model. The IRS
      benchmark shows 81% false positives is what "working" can look like at
      low base rates.
    red_flag: A single accuracy number.
    source_url: https://www.taxpayeradvocate.irs.gov/wp-content/uploads/2020/07/ARC18_Volume1_MSP_05_FalsePositiveRates.pdf
  - id: data-analytics-q05
    question: >-
      Where exactly is human review mandatory, as a designed control? Can
      the system technically execute an adverse action with no human
      sign-off?
    good_answer: >-
      Human sign-off enforced in the system design, not just in policy.
    red_flag: >-
      Auto-execution is possible and "most customers add review."
    source_url: null
  - id: data-analytics-q06
    question: >-
      What testing across race, disability, age, and language has been done,
      on which population, and will you share the results? Has any customer,
      regulator, or DOJ inquiry examined this product?
    good_answer: >-
      Shared testing results and a straight answer on regulatory attention.
    red_flag: '"Bias-free" claims, or evasion about known inquiries.'
    source_url: https://www.pbs.org/newshour/nation/ap-report-doj-examining-ai-screening-tool-used-by-pa-child-welfare-agency
  - id: data-analytics-q07
    question: >-
      When our input data is wrong, stale, or missing, does the system flag
      uncertainty or silently score anyway?
    good_answer: Explicit data-quality gates and uncertainty flags.
    red_flag: >-
      Silent scoring. Idaho scored unreliable data; Missouri's algorithm
      shipped with syntax errors.
    source_url: https://www.btah.org/case-studies.html
  - id: data-analytics-q08
    question: >-
      What drift monitoring and revalidation exist, who sees the results,
      and what triggers suspension of the model?
    good_answer: >-
      A monitoring regime with named owners and suspension triggers.
    red_flag: No revalidation after go-live.
    source_url: null
  - id: data-analytics-q09
    question: >-
      When we discover a wrong score, what is the process to correct it,
      find everyone else affected by the same defect, and make them whole?
    good_answer: >-
      A defect-to-remediation workflow that can enumerate all affected
      people.
    red_flag: Correction handled case by case with no systematic lookback.
    source_url: null
  - id: data-analytics-q10
    question: >-
      For LLM insight layers: how do you prevent hallucinated numbers, and
      does every generated claim link to the underlying query and rows?
    good_answer: >-
      Full provenance: every claim links to the query and rows behind it.
    red_flag: Generated narratives with no provenance.
    source_url: null
  - id: data-analytics-q11
    question: >-
      List the government deployments of this specific model or product,
      including any that were challenged, audited, or decommissioned.
    good_answer: >-
      A complete list including the hard cases. This tool cross-checks
      vendor names against the BTAH case library and the AI Incident
      Database.
    red_flag: >-
      Logos-only marketing, or omission of documented challenges.
    source_url: https://www.btah.org/case-studies.html
  - id: data-analytics-q12
    question: >-
      What warranty, indemnification, and insurance terms apply when system
      errors trigger litigation?
    good_answer: >-
      Concrete terms sized to the documented downside (Michigan: $20M plus a
      rebuild; Florida: a $92.4M rebuild).
    red_flag: Liability capped at fees paid.
    source_url: https://www.btah.org/case-studies.html

elevated_scrutiny_rules:
  - condition: A score or flag can trigger action against a person
    action: >-
      Apply the eligibility-case-mgmt overlay, and use the strongest caution
      band for auto-executed adverse actions.
  - condition: A child-welfare or justice screening pitch
    action: >-
      Render the Allegheny and Loomis context; make the disparate-impact
      question (q06) mandatory.
  - condition: A purely descriptive dashboard or open-data pitch
    action: >-
      Standard track, plus an incumbent-duplication check: does an existing
      Tyler, Power BI, or Tableau contract already cover this?

