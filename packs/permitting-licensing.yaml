legal_context: |-
  ## What the law already says here

  - Due process attaches to licenses. Bell v. Burson, 402 U.S. 535 (1971)
    held a driver's license cannot be suspended without due process, and
    Barry v. Barchi, 443 U.S. 55 (1979) applied similar limits to an
    occupational license
    (https://www.law.cornell.edu/supremecourt/text/402/535;
    https://www.law.cornell.edu/supremecourt/text/443/55). AI-influenced
    denials, suspensions, or revocations of business and professional
    licenses inherit these obligations. No court ruling on AI in permit or
    license adjudication was found in public sources as of this review.
  - Permit shot clocks are statutory. California's Permit Streamlining Act
    (Gov. Code section 65920 and following, 1977) sets decision deadlines
    for development permits. Texas HB 14 (effective Sept 1, 2023) lets
    applicants engage third-party reviewers when a regulatory authority
    misses review deadlines
    (https://capitol.texas.gov/tlodocs/88R/analysis/html/HB00014E.htm). A
    tool's completeness determinations and timestamps carry legal weight
    inside these frameworks.
  - Automated issuance is legal where statute says so. California SB 379
    (2022) requires most cities and counties to run online platforms that
    verify code compliance and issue residential solar permits in real time,
    tracked on a state dashboard
    (https://www.energy.ca.gov/programs-and-topics/programs/residential-solar-permit-reporting-program-sb-379/residential-solar).
    This is the template for what legislatively authorized automation looks
    like: prescriptive project types, defined scope, public reporting.
  - Colorado's AI law (SB 24-205) treated access to essential government
    services as a consequential decision. SB 26-189, signed May 2026,
    repealed and reenacted those provisions with new automated
    decision-making requirements effective January 1, 2027; verify current
    text and applicability before citing (https://coag.gov/ai/).
  - The International Code Council announced a strategic collaboration
    making it a reseller of Archistar's eCheck compliance tool, a signal
    that model-code institutions are engaging with automated review
    (https://www.iccsafe.org/about/periodicals-and-newsroom/international-code-council-collaborates-with-archistar-to-modernize-permitting-and-accelerate-housing-development/).
  - Permit files, AI reports, and review logs are generally public records
    under state records laws; ask your records counsel how AI outputs will
    be retained and produced.

realistic_pricing: |-
  Public anchors exist in this category, unusually for government AI:

  - Austin pays Archistar $3.5 million over three years, up to $6 million
    over five, for citywide residential AI plan-review pre-checks
    (https://www.kut.org/housing/2024-10-11/austin-tx-artificial-intelligence-building-applications-permits-construction).
  - Los Angeles City and County received the same vendor's tool free through
    a state and philanthropic arrangement after the 2025 fires
    (https://www.gov.ca.gov/2025/04/30/governor-newsom-announces-launch-of-new-ai-tool-to-supercharge-the-approval-of-building-permits-and-speed-recovery-from-los-angeles-fires/).
  - Kelowna, BC built its permit assistant with Microsoft on a $350,000
    provincial grant
    (https://www.biv.com/news/real-estate/kelowna-turns-artificial-intelligence-help-housing-backlog-8294907).
  - SolarAPP+ is free to jurisdictions for instant residential solar
    permitting, developed by NREL, with California grant funding available
    for implementation
    (https://www.energy.ca.gov/programs-and-topics/programs/residential-solar-permit-reporting-program-sb-379/residential-solar).
  - For scale on full system replacements (not AI): Honolulu's HNL Build
    cost $7.3 million across platform and implementation, on a Clariti
    software selection of $5.6 million
    (https://www.hawaiipublicradio.org/local-news/2024-03-28/honolulu-permitting-department-entering-digital-age-new-software-suite-clariti),
    and Portland's ITAP grew from $8.2 million to $11.8 million before
    being halted.

  If a quote for pre-check software lands at several times Austin's
  per-year rate for a similar population, ask what accounts for the
  difference. We could not find published per-permit or small-city SaaS
  price lists in public sources; treat any figure a vendor quotes for
  "typical" small-city pricing as unverified until it is in your contract.

