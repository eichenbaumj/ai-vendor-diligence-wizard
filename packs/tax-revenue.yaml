failure_modes:
  - title: Regressive mass appraisal that shifted the tax burden (Cook County)
    description: >-
      The Chicago Tribune and ProPublica Illinois "Tax Divide"
      investigation, with a University of Chicago study, found Cook
      County's residential assessments overvalued low-priced homes and
      undervalued high-priced ones, shifting at least $2.2 billion in
      property taxes onto lower-value homeowners between 2011 and 2015. The
      assessor's office was not running the standard statistical checks
      that would have caught it. Any vendor valuation model can reproduce
      this failure if nobody checks ratio statistics by price tier.
    named_incident: >-
      Cook County "Tax Divide" investigation; $2.2 billion property tax
      shift, 2011-2015 (Pulitzer finalist, 2018)
    source_url: https://www.propublica.org/article/cook-county-property-tax-shift-regressive-assessments
  - title: Over-assessment at scale with foreclosure consequences (Detroit)
    description: >-
      A 2020 Detroit News investigation found Detroit overtaxed homeowners
      by at least $600 million between roughly 2010 and 2016, assessing
      many properties far above Michigan's constitutional cap of 50 percent
      of market value. The Citizens Research Council's 2021 analysis ties
      the failure to mass-appraisal practice: values were not brought down
      as the market fell, and the lowest-value homes bore the worst errors,
      feeding tax foreclosures. Assessment error at this scale takes homes.
    named_incident: >-
      Detroit $600 million over-assessment, 2010-2016 (Detroit News, Jan
      2020; CRC of Michigan analysis, Nov 2021)
    source_url: https://crcmich.org/understanding-how-detroits-property-tax-assessment-process-contributed-to-the-600-million-over-assessment
  - title: Automated fraud adjudication without human review (Michigan MiDAS)
    description: >-
      Michigan's MiDAS system auto-adjudicated unemployment-insurance
      fraud with no human review. A state review found its determinations
      were wrong more than 90 percent of the time; roughly 40,000 people
      were accused, with garnishments and bankruptcies that followed, and
      the state paid a $20 million settlement in 2022. The vendors, SAS and
      Fast Enterprises, were sued alongside the state in the Cahoo
      litigation
      (https://www.btah.org/case-study/michigan-unemployment-insurance-false-fraud-determinations.html).
      MiDAS is the canonical revenue-side automation failure.
    named_incident: >-
      Michigan MiDAS false fraud determinations; $20M civil-rights
      settlement (2022)
    source_url: https://www.michigan.gov/ag/news/press-releases/2022/10/20/som-settlement-of-civil-rights-class-action-alleging-false-accusations-of-unemployment-fraud
  - title: Refund screening that flags mostly legitimate taxpayers (IRS)
    description: >-
      The National Taxpayer Advocate's 2018 Annual Report to Congress
      found the false-positive rate of the IRS's non-identity-theft refund
      fraud filters was 81 percent (63 percent for identity-theft filters)
      between January and October 2018. The filters protected about $7.6
      billion in revenue while delaying almost $20 billion in legitimate
      refunds. This is the base-rate problem every refund-screening pitch
      must answer: at low fraud prevalence, even a good model flags mostly
      innocent people.
    named_incident: >-
      IRS refund fraud filters, 81% false-positive rate (National Taxpayer
      Advocate, 2018 Annual Report, MSP #5)
    source_url: https://www.taxpayeradvocate.irs.gov/wp-content/uploads/2020/07/ARC18_Volume1_MSP_05_FalsePositiveRates.pdf
  - title: A tax authority's risk model that scored nationality (Netherlands)
    description: >-
      The Dutch tax administration's risk-classification model for
      childcare benefit claims used nationality as a risk factor. Tens of
      thousands of parents were wrongly accused of fraud and ordered to
      repay large sums; families went bankrupt and the Dutch cabinet
      resigned over the scandal in January 2021. Amnesty International's
      "Xenophobic Machines" report (Oct 25, 2021) documents the model's
      design and the discrimination that resulted.
    named_incident: >-
      Dutch childcare benefits scandal (toeslagenaffaire); cabinet
      resignation, Jan 2021
    source_url: https://www.amnesty.org/en/documents/eur35/4686/2021/en/
  - title: Opaque cross-agency risk profiling struck down in court (SyRI)
    description: >-
      The District Court of The Hague ruled on February 5, 2020 that the
      Netherlands' SyRI system, which combined agency data to flag people
      for benefits and tax fraud risk, violated Article 8 of the European
      Convention on Human Rights. The court's core findings were opacity
      (no insight into the risk indicators or model) and disproportionate
      data collection. It is the clearest judicial statement that secret
      government risk scoring fails legal scrutiny.
    named_incident: >-
      NJCM et al. v. the Netherlands (SyRI), Hague District Court, Feb 5,
      2020
    source_url: https://www.escr-net.org/caselaw/2020/nederlands-juristen-comite-voor-mensenrechten-et-al-v-netherlands-eclinlrbdha20201878/
  - title: Automated debt raising at national scale (Robodebt)
    description: >-
      Australia's Robodebt scheme used automated income averaging to raise
      unlawful welfare debts at national scale; the class-action settlement
      was valued at about A$1.8 billion, covering roughly 430,000 wrongly
      raised debts, and a 2023 Royal Commission found the scheme neither
      fair nor legal. It is the collections-side cautionary case: an
      automated formula generated debts, the burden of disproof fell on
      residents, and the human review layer never really existed.
    named_incident: Australia Robodebt Royal Commission (2023)
    source_url: https://clcs.org.au/robodebt-royal-commission-report-unravels-systemic-injustice-and-recommends-urgent-reform/
  - title: An official chatbot that invented the rules (NYC MyCity)
    description: >-
      NYC's MyCity chatbot, an official city channel for business owners,
      confidently invented rules and told users to break the law (The
      Markup, Mar 29, 2024). A taxpayer chatbot that misstates a filing
      deadline or a penalty rule creates real liabilities for residents
      who reasonably relied on an official government answer.
    named_incident: NYC MyCity chatbot (The Markup, Mar 29, 2024)
    source_url: https://themarkup.org/artificial-intelligence/2024/03/29/nycs-ai-chatbot-tells-businesses-to-break-the-law
  - title: LLM-specific failure patterns in tax work
    description: >-
      Near-term patterns specific to language models in revenue offices: a
      generated paragraph is not a legally sufficient assessment notice or
      deficiency explanation; automation bias turns "an appraiser reviews
      every value" into rubber-stamping at Detroit scale; extraction errors
      from deeds, renditions, and returns propagate silently into values
      and bills; and models are sycophantic toward an auditor's hypothesis
      about a taxpayer. The IRS's own rules-plus-models screening history
      (NTA 2018) shows how layered filters compound false positives.
    named_incident: >-
      IRS DDb/RRP layered screening, 81% false-positive rate (NTA 2018
      Annual Report, MSP #5)
    source_url: https://www.taxpayeradvocate.irs.gov/wp-content/uploads/2020/07/ARC18_Volume1_MSP_05_FalsePositiveRates.pdf

skepticism_triggers:
  - claim_pattern: >-
      "Recovers $X million" / "found revenue" / "uncovers unpaid taxes"
    threshold: >-
      Any recovery figure without the matching false-positive rate,
      appeal-overturn rate, and the share actually collected
    why: >-
      Recovery claims count flags rather than sustained outcomes. St. Johns
      County's exemption audit placed almost $800K in liens but had
      collected about $200K (Government Technology, 2020), and MiDAS
      "recoveries" were repaid with a $20M settlement on top.
    source_url: https://www.govtech.com/biz/Startup-Aims-to-Modernize-the-Property-Tax-Exemption-Audit.html
  - claim_pattern: Contingency or percentage-of-recovery pricing
    threshold: >-
      Any fee tied to added assessed value, denied refunds, removed
      exemptions, or collected debt
    why: >-
      The fee structure pays the vendor to over-flag, and residents bear
      the appeal burden for every error. Ask for flat pricing or walk the
      claim back to a pilot with independent error measurement.
    source_url: null
  - claim_pattern: '"99% accuracy" for fraud, refund, or audit screening'
    threshold: >-
      Any accuracy claim without a false-positive rate at your fraud
      prevalence and volumes
    why: >-
      At low prevalence, high accuracy still means most flagged taxpayers
      are innocent. The IRS's own filters ran an 81% false-positive rate
      in 2018 while "protecting revenue."
    source_url: https://www.taxpayeradvocate.irs.gov/wp-content/uploads/2020/07/ARC18_Volume1_MSP_05_FalsePositiveRates.pdf
  - claim_pattern: >-
      "Fully automated" or "touchless" determinations, liens, offsets, or
      garnishments
    threshold: Any such claim applied to an adverse action
    why: >-
      Presumptively disqualifying. This is the MiDAS and Robodebt pattern:
      auto-adjudication was wrong more than 90 percent of the time in
      Michigan.
    source_url: https://www.michigan.gov/ag/news/press-releases/2022/10/20/som-settlement-of-civil-rights-class-action-alleging-false-accusations-of-unemployment-fraud
  - claim_pattern: '"Proprietary model; we cannot disclose the factors"'
    threshold: >-
      Any trade-secret posture over valuation or scoring logic that faces
      an appeal or public-records request
    why: >-
      The Hague court struck down SyRI for exactly this opacity, and Cook
      County publishes its own valuation model code, so secrecy is a
      vendor choice, and the public sector's own benchmark refutes the
      claim that it is necessary.
    source_url: https://github.com/ccao-data/model-res-avm
  - claim_pattern: '"Defensible values" or "fewer appeals" for assessment models'
    threshold: >-
      No ratio-study statistics (COD, PRD/PRB) broken out by neighborhood
      and price tier
    why: >-
      Cook County's regressivity hid inside county-wide averages. IAAO
      ratio standards exist precisely so uniformity is checked by tier;
      a vendor who will not produce them has not measured equity.
    source_url: https://www.iaao.org/wp-content/uploads/Standard_on_Ratio_Studies.pdf
  - claim_pattern: >-
      "AI identifies improper exemptions" or "finds delinquents" for
      collections targeting
    threshold: >-
      No documented notice-and-cure process and no published error rate
      before liens or removals issue
    why: >-
      A false flag here becomes a lien on a qualified homeowner, often
      elderly or disabled (homestead and senior exemptions are the ones
      being audited). The process design matters more than the model.
    source_url: null
  - claim_pattern: '"Trusted by X states" or a long agency logo wall'
    threshold: >-
      References that cannot be tied to named, callable production
      deployments
    why: >-
      Even EPIC, using public-records requests, could not establish the
      true scope of Pondera's government footprint. Call the named
      agencies and ask what is actually in production.
    source_url: https://epic.org/pondera-surveillance/
  - claim_pattern: >-
      "FedRAMP/GovRAMP compliant" or vague "IRS-grade security" for systems
      touching federal tax information
    threshold: >-
      The word "compliant" instead of "authorized," or no answer on IRS
      Publication 1075
    why: >-
      Verify authorization on the marketplaces directly; "in process" is
      not "authorized." Any system touching federal tax information must
      meet Pub 1075 safeguarding requirements, and 26 U.S.C. 6103 attaches
      serious statutory penalties to unauthorized disclosure.
    source_url: https://marketplace.fedramp.gov/
  - claim_pattern: A taxpayer chatbot that answers legal or filing questions
    threshold: >-
      No grounding in your statutes and forms, no accuracy measurement,
      and no correction pipeline
    why: >-
      NYC's MyCity chatbot invented rules on an official channel and told
      businesses to break the law. Wrong deadline or penalty answers
      create liabilities for residents who relied on them.
    source_url: https://themarkup.org/artificial-intelligence/2024/03/29/nycs-ai-chatbot-tells-businesses-to-break-the-law

diligence_questions:
  # select: NEW question-selection metadata. base = default slate;
  # claim_types fire on matching pitch claims; finding_ids fire on wizard
  # check findings; elevated joins when elevated scrutiny fires; tiers are
  # contract/reference/demo-stage; weight 0-10.
  - id: tax-revenue-q01
    question: >-
      Does your system ever finalize an assessed value, deny a refund, file
      a lien, garnish wages, remove an exemption, or flag a taxpayer for
      fraud on its own, or does a named human make every adverse decision?
    good_answer: >-
      An unambiguous "a named human makes every adverse decision," with UI
      evidence showing where the human acts and what they see.
    red_flag: >-
      "Configurable," "auto-finalize," "straight-through processing," or
      any hedging. This question has no acceptable middle answer.
    source_url: https://www.michigan.gov/ag/news/press-releases/2022/10/20/som-settlement-of-civil-rights-class-action-alleging-false-accusations-of-unemployment-fraud
    select:
      base: true
      elevated: true
      weight: 10
  - id: tax-revenue-q02
    question: >-
      For fraud, refund, or audit screening: what is your false-positive
      rate at our volumes and our fraud prevalence, how was it measured,
      and what happens to a taxpayer's money while they are flagged?
    good_answer: >-
      A measured false-positive rate with a denominator and time-to-release
      data for flagged refunds, or an honest "we have not measured that."
    red_flag: >-
      An accuracy percentage with no false-positive rate. The IRS's own
      filters ran 81% false positives in 2018; a vendor who has not
      measured theirs has not confronted the base-rate problem.
    source_url: https://www.taxpayeradvocate.irs.gov/wp-content/uploads/2020/07/ARC18_Volume1_MSP_05_FalsePositiveRates.pdf
    select:
      base: true
      claim_types: [performance]
      weight: 9
  - id: tax-revenue-q03
    question: >-
      For valuation models: show ratio-study results (COD, PRD or PRB) by
      neighborhood and price tier from a jurisdiction like ours, and will
      you support an independent ratio study on our parcels before any
      value you produce reaches a tax bill?
    good_answer: >-
      IAAO-standard statistics broken out by tier and geography, plus a
      yes on the independent pre-deployment study.
    red_flag: >-
      County-wide averages only, or no ratio statistics at all. Cook
      County's $2.2 billion shift hid inside averages.
    source_url: https://www.iaao.org/wp-content/uploads/Standard_on_Ratio_Studies.pdf
    select:
      base: true
      claim_types: [performance]
      weight: 9
  - id: tax-revenue-q04
    question: >-
      When a resident appeals a value or contests a flag, exactly what will
      you disclose about how the number was produced, to us, to the
      appellant, and in a public-records request? Is anything withheld as a
      trade secret?
    good_answer: >-
      A written commitment that model factors, inputs, and the specific
      basis for the individual decision are disclosable, with an example
      appeal packet. Cook County publishes its whole model; that is the
      benchmark.
    red_flag: >-
      Any trade-secret carve-out over decision logic. Courts struck down
      SyRI for opacity, and secret formulas do not survive appeals.
    source_url: https://github.com/ccao-data/model-res-avm
    select:
      base: true
      elevated: true
      weight: 9
  - id: tax-revenue-q05
    question: >-
      What data sources feed your model, and which resident
      characteristics, or stand-ins for them like neighborhood, are used as
      inputs? What testing exists for uneven error rates across price
      tiers, neighborhoods, and, where lawful, race and ethnicity?
    good_answer: >-
      A complete input list, an explanation of proxy handling, and
      shareable disparate-performance results, plus support for our own
      testing. The Dutch tax authority scored nationality; that is the
      failure to rule out.
    red_flag: >-
      "Our AI is bias-free" with no data, or refusal to enumerate inputs.
    source_url: https://www.amnesty.org/en/documents/eur35/4686/2021/en/
    select:
      elevated: true
      weight: 8
  - id: tax-revenue-q06
    question: >-
      Before any lien, exemption removal, or assessment increase your
      system drives, what notice does the resident get, in what languages,
      and how do they fix an error without hiring a lawyer or an appraiser?
    good_answer: >-
      A documented notice-and-cure workflow with real timelines, plain
      language templates, and a no-cost correction path, shown in the
      product.
    red_flag: >-
      Notice happens "through your existing process" with no vendor
      support, or cure requires a formal appeal for every error.
    source_url: null
    select:
      base: true
      weight: 8
  - id: tax-revenue-q07
    question: >-
      How are you paid? Is any part of your fee contingent on added
      assessed value, removed exemptions, denied refunds, or collected
      debt, and will you show us the full fee schedule?
    good_answer: >-
      Flat or volume-based pricing with a published schedule, and a clear
      no on contingency fees for adverse actions.
    red_flag: >-
      Percentage-of-recovery pricing. It pays the vendor to over-flag and
      leaves residents carrying the appeal burden for every error.
    source_url: null
    select:
      claim_types: [pricing]
      weight: 7
  - id: tax-revenue-q08
    question: >-
      Name three tax or revenue agencies of our size where this is in
      production rather than a pilot, that we can call. What independent
      evaluations of the product exist?
    good_answer: >-
      Named production references with callable contacts, plus any
      independent evaluation or oversight review.
    red_flag: >-
      Logo walls, pilots presented as production, or "references under
      NDA." EPIC could not verify one major vendor's claimed footprint
      even through public-records requests.
    source_url: https://epic.org/pondera-surveillance/
    select:
      claim_types: [customer, identity]
      finding_ids: [customers]
      weight: 7
  - id: tax-revenue-q09
    question: >-
      Where does taxpayer data live, who can see it, and is any of it used
      to train models or shared with affiliates? If the system touches
      federal tax information, how do you meet IRS Publication 1075, and
      which of FedRAMP, GovRAMP, or a state RAMP authorization do you
      actually hold?
    good_answer: >-
      Written no-training terms, a Pub 1075 answer that names controls and
      audits, and authorizations you can verify at
      https://marketplace.fedramp.gov/ and https://govramp.org/. "In
      process" is not "authorized."
    red_flag: >-
      "Compliant" phrasing, verbal assurances, or a vendor who has never
      heard of Pub 1075 asking for return data.
    source_url: https://www.irs.gov/pub/irs-pdf/p1075.pdf
    select:
      claim_types: [compliance]
      finding_ids: [fedramp_marketplace, govramp, txramp, cert-vocab]
      weight: 8
  - id: tax-revenue-q10
    question: >-
      What is your measured accuracy on OUR state's tax rules and forms,
      evaluated against our statutes and historically adjudicated appeals
      or audits, and what is the denominator?
    good_answer: >-
      State-specific evaluation results with a defined denominator, or an
      honest "we have not measured that yet."
    red_flag: >-
      A generic number from another state or a demo corpus. Tax rules,
      exemption criteria, and assessment cycles differ by state; accuracy
      does not transfer.
    source_url: null
    select:
      claim_types: [performance]
      finding_ids: ["perf-*"]
      weight: 7
  - id: tax-revenue-q11
    question: >-
      What is the realistic review burden for our staff: items per reviewer
      per day, and what override rates do you see in production?
    good_answer: >-
      Real numbers: plausible per-item review time and a nonzero override
      rate from a named deployment.
    red_flag: >-
      No override data, or flag volumes that make genuine review
      impossible. Near-zero overrides means the human is a rubber stamp,
      which is how MiDAS-scale harm happens under a nominal review layer.
    source_url: https://www.btah.org/case-study/michigan-unemployment-insurance-false-fraud-determinations.html
    select:
      elevated: true
      weight: 7
  - id: tax-revenue-q12
    question: >-
      If we discover a systematic error, wrong values in one neighborhood,
      a filter flagging a group of taxpayers, how fast can you identify
      every affected parcel or account, and how do you support corrected
      notices, refunds, and interest?
    good_answer: >-
      A concrete plan: affected-record queries, correction and refund
      workflows, notification templates, and committed timelines. Detroit
      shows what unremediated assessment error costs residents.
    red_flag: >-
      No answer here means no deployment. "That would be a change order"
      is a no.
    source_url: https://crcmich.org/understanding-how-detroits-property-tax-assessment-process-contributed-to-the-600-million-over-assessment
    select:
      elevated: true
      tiers: [3, 4]
      weight: 8
  - id: tax-revenue-q13
    question: >-
      Who bears the cost when a system error produces a wrongful lien,
      denied refund, or inflated bill, and will you accept indemnification
      and audit-rights clauses in the contract?
    good_answer: >-
      Contractual acceptance of indemnification and audit rights, in
      writing.
    red_flag: >-
      Liability pushed entirely onto the agency. Vendor accountability
      was contested all the way through the MiDAS litigation; settle it in
      the contract rather than in court.
    source_url: https://www.btah.org/case-study/michigan-unemployment-insurance-false-fraud-determinations.html
    select:
      tiers: [3, 4]
      weight: 7
  - id: tax-revenue-q14
    question: >-
      For taxpayer chatbots: how is every answer grounded in our current
      statutes, forms, and deadlines; how do you measure answer accuracy;
      and what is the correction pipeline when it gets one wrong?
    good_answer: >-
      Retrieval grounded in your published sources with citations shown to
      the user, a measured accuracy number on a tax-question test set, an
      escalation path to staff, and a same-week correction process.
    red_flag: >-
      "It's trained on tax data" with no grounding, no measurement, and no
      correction pipeline. NYC's chatbot invented rules on an official
      channel.
    source_url: https://themarkup.org/artificial-intelligence/2024/03/29/nycs-ai-chatbot-tells-businesses-to-break-the-law
    select:
      tiers: [3, 4]
      weight: 6
  - id: tax-revenue-q15
    question: >-
      Who updates the system when our statutes, rates, exemption criteria,
      or assessment calendar change, how fast, and how is each change
      tested before it touches values or bills?
    good_answer: >-
      A named update process with turnaround commitments and regression
      testing against prior-year outcomes.
    red_flag: >-
      No update pipeline, or updates only at annual release. Tax law
      changes mid-cycle; a model scoring against last year's rules
      produces wrong bills quietly.
    source_url: null
    select:
      tiers: [3, 4]
      weight: 6

elevated_scrutiny_rules:
  - condition: Any match on this pack
    action: >-
      The output floor is the "enhanced review" band. The "established
      vendor, proceed to demo" band is unavailable until the
      human-decides-adverse-actions question (q01) is answered.
  - condition: >-
      A fraud-detection, refund-screening, audit-selection, or
      delinquency-scoring pitch
    action: >-
      Classify as an adverse-action system regardless of framing, and
      trigger the eligibility-case-mgmt overlay: prepend its "Why this
      category is different" block and add its q01, q02, q03, and q12.
      MiDAS and the Dutch childcare scandal were both revenue-side
      systems.
  - condition: >-
      A claim of automated liens, garnishments, offsets, exemption
      removals, or assessment finalization
    action: Strongest caution band, always.
  - condition: >-
      A valuation-model pitch with no ratio-study statistics by price tier
    action: >-
      Raise to enhanced review and require q03 and q04 answers before any
      demo-stage evaluation; regressivity is invisible in averages.
  - condition: >-
      A taxpayer chatbot or staff copilot with a named human making every
      decision and no adverse-action output
    action: >-
      May be evaluated on standard merits, with q01, q04, q14, and q15
      still included.

