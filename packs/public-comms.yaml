# Sector pack: public-comms (v1)
# Authoring rules: packs/pack-spec.md. Validated by scripts/validate-packs.ts.
pack_id: public-comms
pack_name: Public Communications, Websites & Chatbots

definition: >-
  Resident-facing digital communications AI: website chatbots and AI search,
  notification and email platforms with AI features, real-time meeting
  interpretation, and machine translation of public content. This pack does
  not cover phone and contact-center AI (see the call-center pack) or
  chatbots that answer benefits-eligibility questions (that adds the
  eligibility-case-mgmt overlay).

inclusion_test:
  - >-
    Does the pitch offer a website chatbot, AI site search, or a "digital
    assistant" for residents?
  - >-
    Does it offer translation or interpretation of public content or
    meetings?
  - >-
    Does it offer resident notification, email, or engagement tooling with
    AI features?
  - >-
    Is the primary interface the agency's website or public meetings rather
    than the phone?

scrutiny_tier: standard

incumbent_landscape: >-
  A crowded small-to-mid vendor field sells chatbots and AI search to cities
  and counties: K12 Insight, Apptegy, Element451, Citibot, Polimorphic,
  Tyler Technologies, and Verint, with documented contract pricing spanning
  roughly $5,600 basic to $759K+ enterprise
  (https://blogs.civiciq.com/2025/12/02/government-ai-chatbots-311-rfps-vendor-pricing-guide-2025/).
  Granicus is the communications incumbent: govDelivery claims a 300M+
  subscriber network (vendor-reported) plus a "Government Experience Agent"
  (https://granicus.com/products/govdelivery/). State-portal chatbots have a
  decade of history: Mississippi "Missi" (Tyler, 2017), Georgia DOL "George
  A.I." (Cisco; 2.5 million+ users and an agency-claimed 97% accuracy we
  could not verify in public sources), Massachusetts "Ask MA" (NeuroSoph;
  roughly 1.2 million monthly users), Texas (Capgemini), Atlanta "Ava"
  (Zammo.ai), and Vermont "ChatVT," which gets annual performance reviews
  (https://statescoop.com/government-ai-chatbots-state-local-websites-2024/).
  For translation: Wordly for live meeting interpretation (Santa Barbara CA,
  North Las Vegas NV; https://www.wordly.ai/city-council-translation), and
  New Jersey DOL with U.S. Digital Response as the standout responsible
  machine-translation deployment
  (https://www.usdigitalresponse.org/resources/how-new-jersey-is-using-generative-ai-to-scale-their-human-centered-approach-to-language-access).

