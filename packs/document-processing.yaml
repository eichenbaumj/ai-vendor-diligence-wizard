# Sector pack: document-processing (v1)
# Authoring rules: packs/pack-spec.md. Validated by scripts/validate-packs.ts.
pack_id: document-processing
pack_name: Document Processing & Intake (IDP)

definition: >-
  AI that classifies, extracts data from, redacts, or routes documents:
  mailroom automation, form and handwriting extraction,
  verification-document processing, and records redaction. This pack does not
  cover systems that make eligibility decisions from extracted data (that adds
  the eligibility-case-mgmt overlay) or general document drafting for staff
  (see the staff-productivity pack).

inclusion_test:
  - >-
    Does the pitch mention OCR, document extraction or classification, IDP,
    "digital mailroom," forms processing, or handwriting recognition?
  - >-
    Does it target document backlogs, verification documents, scanned mail or
    faxes, or records digitization?
  - >-
    Does it offer redaction of PII from records (court, land, personnel)?
  - >-
    Does it claim an "automation rate" or "straight-through processing," or
    use per-page or per-document pricing?

scrutiny_tier: standard

incumbent_landscape: >-
  A mature category being disrupted by LLM-native extraction. Gartner's first
  IDP Magic Quadrant (Sep 3, 2025) covers a market of 100+ vendors with five
  Leaders: ABBYY, Hyperscience, Infrrd, Tungsten Automation, and UiPath
  (https://www.gartner.com/en/documents/6912666). Five tiers: (1) hyperscaler
  APIs (AWS Textract, Azure AI Document Intelligence, Google Document AI),
  usually arriving inside an integrator's pitch; (2) enterprise IDP platforms
  (the Leaders above, plus WorkFusion, IBM Datacap, OpenText Captiva,
  Grooper); (3) government redaction specialists (Extract Systems, CSI
  Intellidact); (4) ECM incumbents with AI add-ons (Laserfiche, Hyland
  OnBase, Tyler). Check whether your existing ECM contract already includes
  capture or IDP before engaging a new vendor; many cold pitches duplicate
  capability you already own. (5) LLM-native startups (Extend, Reducto,
  Sensible, Instabase, LandingAI, Nanonets, Docsumo). Most inbound cold email
  comes from this tier, and few of these hold FedRAMP or GovRAMP
  authorizations or named U.S. state references. The core triage insight:
  many pitches are thin wrappers over the same three hyperscaler APIs. Ask
  what engine is actually under the hood.

