registries_to_check:
  - name: FedRAMP Marketplace
    url: https://marketplace.fedramp.gov/
    what_it_proves: >-
      Whether this specific product holds a federal cloud authorization,
      and at what level. "In process" is not "authorized."
  - name: GovRAMP Authorized Product List
    url: https://govramp.org/
    what_it_proves: >-
      State-oriented cloud security verification. Formerly StateRAMP; the
      name changed in February 2025.
  - name: AI Incident Database
    url: https://incidentdatabase.ai/
    what_it_proves: >-
      A public log of AI system failures. Search the vendor and product
      name.
  - name: Benefits Tech Advocacy Hub case library
    url: https://www.btah.org/case-studies.html
    what_it_proves: >-
      A negative registry of documented harms from automated government
      systems, including the MiDAS record that anchors this pack.
  - name: Cook County Assessor open model repositories
    url: https://github.com/ccao-data
    what_it_proves: >-
      What full valuation-model transparency looks like in production
      government use. A useful benchmark against any "must stay
      proprietary" claim.
  - name: IAAO Standard on Ratio Studies
    url: https://www.iaao.org/wp-content/uploads/Standard_on_Ratio_Studies.pdf
    what_it_proves: >-
      The professional standard for measuring assessment accuracy and
      uniformity (COD, PRD, PRB). The statistics a credible valuation
      vendor should already report, by price tier and geography.

legal_context: |-
  - 26 U.S.C. 6103 (current): tax returns and return information are
    confidential, with penalties for unauthorized disclosure. Any vendor
    architecture that moves return data must be evaluated against it
    (https://www.law.cornell.edu/uscode/text/26/6103).
  - IRS Publication 1075 (current edition): safeguarding requirements for
    federal tax information held by state and local agencies and their
    contractors, including cloud and contractor-access rules
    (https://www.irs.gov/pub/irs-pdf/p1075.pdf).
  - IAAO Standard on Ratio Studies: the professional standard for
    assessment level and uniformity statistics (COD, PRD, PRB). Many
    states embed these thresholds in equalization law; a valuation model
    that cannot produce them cannot show it treats price tiers evenly
    (https://www.iaao.org/wp-content/uploads/Standard_on_Ratio_Studies.pdf).
  - State constitutional and statutory assessment limits: Michigan's
    constitution caps assessments at 50 percent of market value, the cap
    Detroit's 2010-2016 assessments exceeded (CRC of Michigan, Nov 2021:
    https://crcmich.org/understanding-how-detroits-property-tax-assessment-process-contributed-to-the-600-million-over-assessment).
    Check your own state's uniformity clause and appeal deadlines.
  - Michigan MiDAS settlement (Oct 2022) and the Cahoo litigation:
    automated adverse determinations without meaningful review produced a
    $20M settlement, and the MiDAS contractors were sued alongside the
    state
    (https://www.btah.org/case-study/michigan-unemployment-insurance-false-fraud-determinations.html).
  - NJCM v. the Netherlands (SyRI), Hague District Court, Feb 5, 2020:
    opaque government risk profiling for benefits and tax enforcement
    violated ECHR Article 8
    (https://www.escr-net.org/caselaw/2020/nederlands-juristen-comite-voor-mensenrechten-et-al-v-netherlands-eclinlrbdha20201878/).
  - OMB M-25-21 (2025): fraud detection and adjudication uses of AI are
    presumptively high-impact for federal agencies, requiring testing,
    human oversight, and remedies; a useful bar to hold state-level
    vendors to
    (https://www.whitehouse.gov/wp-content/uploads/2025/02/M-25-21-Accelerating-Federal-Use-of-AI-through-Innovation-Governance-and-Public-Trust.pdf).
  - Taxpayer Bill of Rights, IRC 7803(a)(3): the right to be informed, to
    quality service, and to a fair and just tax system framed the National
    Taxpayer Advocate's false-positive findings; state taxpayer-rights
    statutes commonly mirror it.
  - Colorado AI Act (delayed to Jun 30, 2026) and Texas TRAIGA (effective
    Jan 1, 2026) reach consequential government decisions. Verify current
    status before citing.

realistic_pricing: |-
  Published anchors are thin in this category; treat labeled items as
  practitioner estimates rather than quotes.

  - Statewide integrated tax systems are eight-figure, multi-year
    programs: Indiana signed a 10-year, $77.7 million contract with Fast
    Enterprises in 2018 (Indianapolis Business Journal:
    https://www.ibj.com/articles/70354-state-signs-77m-contract-to-upgrade-tax-administration-technology).
    An "AI module" quoted anywhere near ITS scale for a bolt-on tool
    deserves the question "what exactly are we buying?"
  - County CAMA replacements and reassessment services typically run six
    to seven figures depending on parcel count (practitioner estimate; no
    reliable public anchor captured this cycle).
  - Narrow AI wedges (exemption monitoring, scoring add-ons) are rarely
    priced publicly; comparable SaaS runs five to low six figures per
    year at county scale (practitioner estimate). Decline
    percentage-of-recovery structures regardless of the sticker price;
    the incentive problem is the cost.
  - Any pricing conversation for fraud, refund, or delinquency scoring is
    premature until questions q01, q02, and q04 pass.

