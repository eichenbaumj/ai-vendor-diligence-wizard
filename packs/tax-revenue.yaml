known_gaps: |-
  - The City of Detroit's own memo confirming the $600M over-taxation
    (detroitmi.gov) is bot-blocked to automated fetches (HTTP 403); the
    figure is carried on the Citizens Research Council analysis instead.
    Re-verify the primary memo manually next cycle.
  - The Library of Congress summary of the SyRI ruling returns 403 to
    automated fetches; the ESCR-Net case page is used instead.
  - Tyler Technologies' Delaware statewide reassessment (Businesswire, Oct
    21, 2021) could not be re-fetched (403); the citation is retained by
    outlet and date, and the contract value was not verified. Tyler's
    "clients in 26 states" figure comes from Tyler's own product page and
    is not independently verified.
  - TrueRoll's 2026 claim of "150+ government offices in 10+ states" is
    vendor-reported (Apr 2026 press release) and was not independently
    verified; the pack carries only the 2020 Government Technology
    reporting.
  - The current production scope of Thomson Reuters Pondera in state tax
    agencies specifically (as opposed to unemployment and benefits
    programs) could not be established; EPIC's records project is cited
    for the opacity itself.
  - Cahoo vendor claims had mixed outcomes: the district court granted
    SAS Institute's motion to dismiss (2018), and the 2023 Sixth Circuit
    opinion notes claims against two private defendants were then still
    pending. The pack therefore says the vendors were "sued," and does not
    claim liability was established. Verify final disposition next cycle.
  - No public price anchor was captured for county CAMA contracts or
    AI bolt-on subscriptions; those lines are labeled practitioner
    estimates.
  - Colorado AI Act and Texas TRAIGA status not re-verified beyond the
    eligibility pack's Aug 2026 review; verify before citing.
  - Robodebt totals vary by source (A$1.73-1.76B raised; 433,000-526,000
    people depending on counting method); the pack carries only the
    settlement-anchored figures (about A$1.8 billion, roughly 430,000
    debts) that its cited source and the class-action record support.
  - An RSI Pennsylvania desk-enforcement contract claim was cut in
    verification: no public source found. Only Rhode Island is carried.
