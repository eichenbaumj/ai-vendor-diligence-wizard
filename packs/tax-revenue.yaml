# Sector pack: tax-revenue (v1 draft). ELEVATED SCRUTINY.
#
# Scrutiny tier rationale: this pack is elevated, not standard. Most of what
# is sold here produces adverse actions against individual residents: a
# higher assessment is a bigger tax bill enforceable by lien and foreclosure
# (Detroit's over-assessment era fed tax foreclosures); a fraud or refund
# flag freezes money a household is owed (IRS filters ran a documented 81%
# false-positive rate in 2018); collections prioritization decides whose
# wages and bank accounts get pursued; and the two landmark automated-
# government failures of the last decade, Michigan MiDAS and the Dutch
# childcare benefits scandal, were both run by revenue-side agencies. The
# adverse-action logic that makes eligibility-case-mgmt elevated applies
# with equal force, so any fraud, refund, or delinquency scoring pitch here
# also triggers that pack's overlay.
#
# NOTE for maintainers: signal_lexicon and the per-question select blocks
# are NEW fields (classifier fallback + question-selection metadata). The
# current packs-types.ts / validate-packs.ts schema is strict and does not
# know them yet; land the schema change in the same wave as this pack.
# Authoring rules: packs/pack-spec.md.
pack_id: tax-revenue
pack_name: Tax, Assessment & Revenue AI

definition: >-
  AI sold to tax assessors, collectors, treasurers, and revenue departments:
  mass-appraisal and automated valuation models, reassessment support,
  appeals triage, exemption auditing, collections prioritization,
  delinquency prediction, refund and return screening, audit selection, and
  taxpayer-facing chatbots. Outputs here change what residents owe, whether
  a refund arrives, and whether a lien or garnishment follows, so most of
  this pack is adverse-action territory. Not this pack alone: benefits
  eligibility and program-integrity systems (eligibility-case-mgmt, which
  this pack triggers as an overlay for any fraud or refund screening
  pitch), pure document extraction (document-processing), and
  general-purpose dashboards (data-analytics).

inclusion_test:
  - >-
    Does the pitch mention property assessment, mass appraisal, CAMA,
    automated valuation models, or reassessment for an assessor or
    appraisal district?
  - >-
    Does it mention tax collections, delinquency prediction, revenue
    recovery, payment-plan targeting, or lien and garnishment workflows?
  - >-
    Does it mention refund screening, return scoring, audit selection, or
    fraud detection for a tax or revenue agency?
  - >-
    Does it mention exemption auditing (homestead, senior, veteran) or
    appeals triage for a tax office?
  - >-
    Does it offer a taxpayer-facing chatbot or virtual assistant for a
    revenue department, collector, or treasurer?

scrutiny_tier: elevated

# NEW FIELD: lowercase domain terms for the code-side classifier fallback.
signal_lexicon:
  - mass appraisal
  - cama
  - avm
  - assessment roll
  - ratio study
  - reassessment
  - homestead exemption
  - appeals triage
  - collections prioritization
  - delinquency prediction
  - refund screening
  - audit selection
  - integrated tax system
  - revenue recovery
  - tax gap

incumbent_landscape: >-
  The core systems are decades-old COTS suites. Fast Enterprises' GenTax
  runs state integrated tax systems in Wisconsin, New Hampshire, Idaho, and
  other states (Government Technology:
  https://www.govtech.com/computing/tax-system-upgrades-increase-speed-efficiency-for-residents);
  Indiana signed a 10-year, $77.7 million GenTax contract in 2018
  (Indianapolis Business Journal). RSI's Government Premier (formerly
  Revenue Premier) holds state integrated-tax contracts, including Rhode
  Island's.
  On the property side, Tyler Technologies' iasWorld / Enterprise
  Assessment & Tax is the largest CAMA and tax-billing suite (clients in 26
  states per Tyler's own materials; Tyler also ran Delaware's
  court-ordered statewide reassessment, Businesswire, Oct 21, 2021).
  Fraud-analytics is a distinct lane: Thomson Reuters acquired Pondera
  (FraudCaster) in 2020, and EPIC's public-records project found the actual
  scope of Pondera's government footprint hard to establish even through
  records requests (https://epic.org/pondera-surveillance/). SAS and Fast
  Enterprises were the MiDAS-era vendors and were sued alongside the state
  in the Cahoo litigation, so incumbency is no safety signal here. The AI-native newcomers sell narrow wedges: TrueRoll
  monitors homestead-exemption eligibility for county tax offices
  (customers in Texas, Florida, Illinois, and Washington, per Government
  Technology). Critical context for any transparency claim: Cook County's
  assessor has published its residential valuation model code and data
  since 2019 (https://github.com/ccao-data/model-res-avm), which means "our
  model must stay secret" is a vendor choice, and the public sector's own
  benchmark says otherwise. Expect general-purpose LLM chatbots rebranded
  as "taxpayer assistants" to arrive through the same channel as every
  other sector.

